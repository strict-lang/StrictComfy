<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moss in the browser</title>
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; color: #d8dee9; font: 16px system-ui, sans-serif; }
	body { display: flex; flex-direction: column; }
	main { flex: 1; min-height: 0; display: flex; gap: 24px; justify-content: center; padding: 20px 24px 8px; box-sizing: border-box; }
	section { width: min(440px, 46vw); display: flex; flex-direction: column; gap: 12px; min-height: 0; }
	h1 { margin: 0; font-size: 24px; font-weight: 600; }
	label a { color: #5fb3f6; font-size: 12px; }
	label { font-size: 13px; color: #8b97a5; display: flex; flex-direction: column; gap: 4px; }
	textarea, input, select { font: inherit; color: #d8dee9; background: #141b23; border: 1px solid #2b3540; border-radius: 6px; padding: 8px; }
	textarea { resize: none; height: 96px; }
	.row { display: flex; gap: 10px; }
	.row label { flex: 1; min-width: 0; }
	button { font: inherit; font-size: 18px; padding: 12px; border: 0; border-radius: 8px; background: #5fb3f6; color: #0b0f14; cursor: pointer; }
	button:disabled { background: #2b3540; color: #6b7785; cursor: default; }
	#progress { height: 6px; background: #1f2933; border-radius: 3px; overflow: hidden; flex: none; }
	#bar { width: 0; height: 100%; background: #5fb3f6; transition: width 0.3s; }
	#status { min-height: 1.4em; color: #8b97a5; }
	#status.error { color: #e88388; }
	#log { flex: 1; min-height: 80px; font: 12px ui-monospace, monospace; color: #6b7785; white-space: pre-wrap; overflow: auto; margin: 0; background: #0f151c; border-radius: 6px; padding: 8px; }
	#frame { height: 100%; aspect-ratio: var(--aspect, 480 / 848); max-width: 46vw; background: #141b23; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #4b5663; }
	#frame img { width: 100%; height: 100%; object-fit: contain; }
	#stats { position: absolute; left: 12px; top: 8px; font-size: 12px; color: #6b7785; }
	footer { text-align: center; font-size: 13px; color: #6b7785; padding: 8px 24px 12px; }
	footer a { color: inherit; }
</style>
</head>
<body>
<div id="stats"></div>
<main>
	<section>
		<h1>Moss in the browser</h1>
		<label>Prompt <span><a href="https://mossimage.org/prompts/rainy-convenience-store/" target="_blank" rel="noopener">official image of this example</a> · <a href="#" id="random">random</a> Â· <a href="#" id="load">load ComfyUI workflow</a><input type="file" id="workflow" accept=".json" hidden></span><textarea id="prompt">A cinematic, photorealistic nighttime scene of a small neighborhood convenience store on a quiet, rain-soaked street. The warmly illuminated storefront occupies the right half of the frame, while the street recedes into soft mist on the left. A lone young adult wearing a charcoal coat stands just outside the entrance beneath a transparent umbrella, seen in three-quarter rear view, gazing through the glass. Amber light reveals shelves inside and spills across the sidewalk, mingling with muted teal neon reflections in shallow puddles. Individual raindrops bead on the umbrella and catch the storefront light; fine streaks of rain remain visible against the darker street. A slightly weathered bicycle leans beside the entrance. Distant apartment windows and a few out-of-focus streetlights add depth without distracting from the figure. Eye-level wide shot, 35mm lens aesthetic, natural perspective, balanced negative space, restrained teal-and-amber color grading, realistic wet asphalt and glass textures, soft highlight bloom, subtle film grain, and gentle atmospheric depth. Quiet, intimate, and nostalgic rather than dramatic; believable lighting, with the figure clearly silhouetted against the warm window. No prominent readable lettering, logos, or watermarks.</textarea></label>
		<div class="row">
			<label>Size<select id="size">
				<option value="240 432">240p portrait</option><option value="432 240">240p landscape</option>
				<option value="320 576">320p portrait</option><option value="576 320">320p landscape</option>
				<option value="480 848" selected>480p portrait</option><option value="848 480">480p landscape</option>
				<option value="576 1024">576p portrait</option><option value="1024 576">576p landscape</option>
				<option value="720 1280">720p portrait</option><option value="1280 720">720p landscape</option>
			</select></label>
			<label>Quality<select id="quality">
				<option value="best">best (8 steps)</option><option value="fast">fast (8 steps)</option>
				<option value="faster">faster (8 steps)</option><option value="fastest" selected>fastest (4 steps)</option>
				<option value="fastest2steps">fastest2steps (2 steps)</option>
			</select></label>
		</div>
		<div class="row">
			<label>Decoder<select id="decoder">
				<option value="taef2" selected>taef2 (fastest)</option><option value="flux2-small-vae">flux2-small-vae (faster)</option>
				<option value="flux2-vae">flux2-vae (standard)</option>
			</select></label>
			<label>Seed<input id="seed" type="number" min="0" max="4294967295"></label>
		</div>
		<button id="start" disabled>Loading...</button>
		<div id="progress"><div id="bar"></div></div>
		<div id="status">Downloading the page</div>
		<pre id="log"></pre>
	</section>
	<section style="width: auto; align-items: center">
		<div id="frame">The image appears here</div>
	</section>
</main>
<footer>Made with <a href="https://strict-lang.org">Strict</a> 2026-11-02 (c), runs 100% locally with WebGPU on your device. The <a href="https://github.com/strict-lang/StrictComfy">downloadable GitHub version</a> is up to 10x faster.</footer>
<script>
	const element = id => document.getElementById(id);
	const start = element("start"), bar = element("bar"), status = element("status"), log = element("log"), frame = element("frame");
	const seed = element("seed"), size = element("size"), quality = element("quality"), decoder = element("decoder"), prompt = element("prompt");
	const parameters = new URLSearchParams(location.search), began = { time: 0, isRunning: false };
	const counted = (action, sent) => fetch("stats/" + action, sent ? { method: "POST", body: JSON.stringify(sent) } : { method: "POST" })
		.then(response => response.ok ? response.text() : "").then(text => element("stats").textContent = text, () => {});
	counted("visit");
	const randomSeed = () => seed.value = Math.floor(Math.random() * 4294967296);
	if (parameters.get("seed")) seed.value = parameters.get("seed"); else randomSeed();
	const steps = () => ({ fastest: 4, fastest2steps: 2 })[quality.value] || 8;
	const seconds = () => ((performance.now() - began.time) / 1000).toFixed(1) + " s";
	const show = (text, isError) => { status.textContent = text; status.classList.toggle("error", !!isError); };
	const controls = [start, seed, size, quality, decoder, prompt];
	const examples = ["a {red fox|snow leopard|white owl} in a snowy {forest|mountain valley} at {dawn|dusk}, photo",
		"portrait of a {young|old} {fisherman|baker|astronaut} with {freckles|a beard}, {soft window light|golden hour}, photo",
		"a {tiny|cozy} {cabin|lighthouse|tea house} on a {cliff|lake shore} under {northern lights|a starry sky}, photo",
		"{a vintage car|a red bicycle|a food truck} on a rainy {Tokyo|Paris|New York} street at night, neon reflections, photo",
		"macro photo of a {dewdrop on a leaf|ladybug on a flower|frost crystal}, {morning light|backlit}"];
	element("random").onclick = event => {
		event.preventDefault();
		if (!prompt.disabled) prompt.value = examples[Math.floor(Math.random() * examples.length)];
	};
	const enabled = isEnabled => controls.forEach(control => control.disabled = !isEnabled);
	const failed = message => { show(message, true); start.textContent = "Failed"; began.isRunning = false; };
	const printed = text => {
		console.log(text);
		const download = text.match(/^Downloading (\S+): ([\d.]+) of ([\d.]+) MB/);
		if (download)
			bar.style.width = (100 * download[2] / download[3]) + "%";
		if (download)
			return show("Downloading " + download[1] + ": " + Math.round(download[2]) + " of " + Math.round(download[3]) + " MB, kept for the next visit");
		log.textContent += text + "\n";
		requestAnimationFrame(() => log.scrollTop = log.scrollHeight);
		const step = text.match(/^Step (\d+)\/(\d+)/);
		if (step) {
			bar.style.width = (10 + 80 * step[1] / step[2]) + "%";
			show("Sampling step " + step[1] + " of " + step[2] + " done after " + seconds());
		} else if (text.startsWith("Text encoder loaded")) {
			bar.style.width = "4%";
			show("Encoding the prompt after " + seconds());
		} else if (text.startsWith("Moss loaded")) {
			bar.style.width = "10%";
			show("Model loaded after " + seconds() + ", sampling " + steps() + " steps");
		} else if (text.startsWith("Sampled in")) {
			began.sampled = parseFloat(text.slice(11));
			bar.style.width = "90%";
			show("Decoding the image after " + seconds());
		} else if (text.startsWith("Workflow settings:"))
			began.hasLoras = text.includes("--lora ");
		else if (text.startsWith("Workflow: "))
			applied(text.slice(10).split("\t"));
		else if (text.startsWith("Error")) failed(text);
	};
	const applied = ([settings, workflowPrompt]) => {
		const [workflowSeed, width, height, workflowQuality] = settings.split(" ");
		if (workflowSeed !== "-1") seed.value = workflowSeed;
		const value = width + " " + height;
		if (![...size.options].some(option => option.value === value)) size.add(new Option(width + "x" + height + " (workflow)", value));
		size.value = value;
		size.onchange();
		quality.value = workflowQuality;
		prompt.value = workflowPrompt;
		show("Workflow loaded" + (began.hasLoras ? ", its LoRAs are not applied yet" : ""));
	};
	const begin = () => {
		if (began.isStarted)
			return;
		began.isStarted = true;
		setTimeout(() => Module.callMain([]), 0);
	};
	element("load").onclick = event => {
		event.preventDefault();
		if (!start.disabled) element("workflow").click();
	};
	element("workflow").onchange = async () => {
		const file = element("workflow").files[0];
		if (!file) return;
		Module.strictFile("workflow.json", await file.arrayBuffer());
		element("workflow").value = "";
		begin();
		Module.strictInput("workflow workflow.json");
	};
	const shown = (source, name) => {
		frame.textContent = "";
		const image = document.createElement("img");
		image.src = source;
		frame.append(image);
		if (name.startsWith("MossWebStep") || !began.isRunning)
			return;
		began.isRunning = false;
		bar.style.width = "100%";
		show("Done in " + seconds() + " (seed " + began.seed + ")");
		const model = steps() > 4 ? "moss_image_sft_dmd_int4_convrot" : "moss_image_sft_4step_int4_convrot";
		counted("generated", { prompt: began.prompt, model, vae: decoder.value, loras: "", seconds: began.sampled });
		start.textContent = "Generate locally";
		enabled(true);
		randomSeed();
	};
	let pending = "";
	new MutationObserver(changes => changes.forEach(change => change.addedNodes.forEach(node => {
		if (node.tagName === "A" && node.download) {
			pending = node.download;
			node.remove();
		} else if (node.tagName === "IMG" && node.src.startsWith("blob:")) {
			shown(node.src, pending);
			node.remove();
		}
	}))).observe(document.body, { childList: true });
	size.onchange = () => frame.style.setProperty("--aspect", size.value.replace(" ", " / "));
	var Module = {
		noInitialRun: true,
		strictFiles: {
			"qwen3.5_9b_int4_convrot.safetensors": "https://huggingface.co/DeltaEngine/MossInt4/resolve/c829c66fde96084a9c1ab6884437c5d3fcdf5cc7/qwen3.5_9b_int4_convrot.safetensors",
			"moss_image_sft_4step_int4_convrot.safetensors": "https://huggingface.co/DeltaEngine/MossInt4/resolve/c829c66fde96084a9c1ab6884437c5d3fcdf5cc7/moss_image_sft_4step_int4_convrot.safetensors",
			"moss_image_sft_dmd_int4_convrot.safetensors": "https://huggingface.co/DeltaEngine/MossInt4/resolve/c829c66fde96084a9c1ab6884437c5d3fcdf5cc7/moss_image_sft_dmd_int4_convrot.safetensors",
			"qwen35_tokenizer/vocab.json": "https://huggingface.co/Qwen/Qwen3.5-9B/resolve/c202236235762e1c871ad0ccb60c8ee5ba337b9a/vocab.json",
			"qwen35_tokenizer/merges.txt": "https://huggingface.co/Qwen/Qwen3.5-9B/resolve/c202236235762e1c871ad0ccb60c8ee5ba337b9a/merges.txt",
			"qwen35_tokenizer/tokenizer_config.json": "https://huggingface.co/Qwen/Qwen3.5-9B/resolve/c202236235762e1c871ad0ccb60c8ee5ba337b9a/tokenizer_config.json",
			"taef2.safetensors": "https://huggingface.co/madebyollin/taef2/resolve/bd244ebfe4398c84fbf312a2f1c868c676b500e3/taef2.safetensors",
			"flux2-small-vae.safetensors": "https://huggingface.co/black-forest-labs/FLUX.2-small-decoder/resolve/a3efc24f613ef42d9428af62fdbd6f5fd8856c4a/full_encoder_small_decoder.safetensors",
			"flux2-vae.safetensors": "https://huggingface.co/Comfy-Org/Flux-2-Dev/resolve/9630c1b4b6e690497ae0c19bb6b1b35d4ebedcb7/split_files/vae/flux2-vae.safetensors"
		},
		print: printed,
		printErr: printed,
		setStatus: text => {
			const loaded = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
			if (loaded) show("Downloading the page " + (100 * loaded[1] / loaded[2]).toFixed(0) + " %");
		},
		onRuntimeInitialized: () => {
			if (!navigator.gpu)
				return failed("This browser has no WebGPU, use a current Chrome or Edge");
			enabled(true);
			start.textContent = "Generate locally";
			show("The merged Moss model (3 GB) streams in when you generate, the text encoder (4.5 GB) only for your own prompt, both kept for the next visit");
			if (parameters.has("start")) start.click();
		},
		onAbort: what => failed("Error: " + what),
		onExit: code => { if (code !== 0) failed("Exited with code " + code); }
	};
	start.onclick = () => {
		const isFirst = !began.isStarted;
		enabled(false);
		start.textContent = "Generating locally...";
		began.time = performance.now();
		began.isRunning = true;
		began.seed = Math.max(0, Math.min(4294967295, Math.floor(Number(seed.value) || 0)));
		began.prompt = prompt.value.replace(/\s+/g, " ").trim();
		bar.style.width = "0";
		show(isFirst ? "Streaming in the model" : "Sampling " + steps() + " steps");
		begin();
		Module.strictInput([began.seed, size.value, quality.value, decoder.value].join(" ") + "\t" + began.prompt);
	};
	window.addEventListener("error", event => failed(event.message));
</script>
{{{ SCRIPT }}}
</body>
</html>

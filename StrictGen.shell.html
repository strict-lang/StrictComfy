<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StrictGen — images and video</title>
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; color: #d8dee9; font: 16px system-ui, sans-serif; }
	body { display: flex; flex-direction: column; height: 100%; }
	header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: #0f151c; flex: none; }
	header .grow { flex: 1; min-width: 180px; color: #8b97a5; font-size: 13px; }
	main { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: stretch; gap: 28px; padding: 8px 16px; box-sizing: border-box; }
	section.controls { width: min(480px, 42vw); overflow: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; flex: none; }
	section.view { flex: none; display: flex; flex-direction: column; align-items: center; min-height: 0; }
	label { font-size: 13px; color: #8b97a5; display: flex; flex-direction: column; gap: 4px; }
	textarea, input, select { font: inherit; color: #d8dee9; background: #141b23; border: 1px solid #2b3540; border-radius: 6px; padding: 8px; }
	textarea { resize: vertical; min-height: 96px; }
	.row { display: flex; gap: 10px; }
	.row label, .row .field { flex: 1; min-width: 0; }
	.modes { display: flex; gap: 6px; }
	.modes button, button.small, button.ghost { font-size: 14px; padding: 6px 10px; background: #1f2933; color: #d8dee9; border: 0; border-radius: 8px; cursor: pointer; }
	.modes button.on { background: #5fb3f6; color: #0b0f14; }
	button.run { font: inherit; font-size: 18px; padding: 12px 18px; border: 0; border-radius: 8px; background: #5fb3f6; color: #0b0f14; cursor: pointer; }
	button.stop { background: #e88388; color: #0b0f14; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
	.note { color: #e8b383; font-size: 13px; min-height: 1em; }
	.hidden { display: none !important; }
	#loras { display: flex; flex-direction: column; gap: 4px; }
	.lora { display: flex; gap: 8px; align-items: center; }
	.lora span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.lora input { width: 72px; }
	#frame { position: relative; flex: none; overflow: hidden; }
	#frame img, #frame video, #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
	#gallery { flex: none; display: flex; gap: 8px; align-items: center; width: 100%; font-size: 13px; color: #8b97a5; padding-top: 8px; }
	#caption { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	#queue { position: relative; }
	#menu { position: absolute; z-index: 2; top: 100%; right: 0; background: #141b23; border: 1px solid #2b3540; border-radius: 8px; min-width: 280px; max-width: 420px; padding: 8px; }
	#menu div { font-size: 13px; padding: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	details { color: #8b97a5; font-size: 13px; }
	#log { min-height: 200px; max-height: 320px; overflow: auto; font: 13px ui-monospace, monospace; color: #d8dee9; white-space: pre-wrap; background: #0f151c; border-radius: 6px; padding: 8px; margin: 0; }
	@media (max-width: 720px) {
		main { flex-direction: column; }
		section { width: 100%; }
		section.view { order: -1; }
	}
</style>
</head>
<body>
<header>
	<button class="small" id="import">Import workflow</button>
	<input id="workflow" type="file" accept=".json" hidden>
	<div class="grow" id="meters">RAM — · VRAM — · GPU — · CPU —</div>
	<button class="stop" id="stop">Stop</button>
	<div id="queue"><button class="small" id="position">0/0</button><div id="menu" class="hidden"></div></div>
	<label>Machine<select id="machine"><option value="">Best machine</option><option value="local">This PC</option></select></label>
	<label>Repeat<select id="repeat"><option value="1">1x</option><option value="2">2x</option><option value="4">4x</option><option value="10">10x</option><option value="20">20x</option></select></label>
	<button class="run" id="run">Run</button>
</header>
<main>
	<section class="controls">
		<div class="modes">
			<button type="button" data-mode="image" class="on">Image</button>
			<button type="button" data-mode="video">Video</button>
			<button type="button" data-mode="extend">Extend</button>
			<button type="button" data-mode="imagevideo">Image to video</button>
			<button type="button" data-mode="h3image">H3 Image</button>
		</div>
		<label>Prompt<textarea id="prompt">a red fox in a snowy forest at dawn, photo</textarea></label>
		<div id="inputs">
			<label id="inputLabel">Image or video
				<div class="row">
					<button class="small" id="inputPrev" type="button">&#9664;</button>
					<input id="input" type="text" placeholder="png, jpg, or mp4">
					<button class="small" id="inputPick" type="button">File</button>
					<button class="small" id="inputNext" type="button">&#9654;</button>
					<input id="inputFile" type="file" accept=".png,.jpg,.jpeg,.mp4" hidden>
				</div>
			</label>
			<label>Recent<input id="recent" list="recentList" placeholder="this session"><datalist id="recentList"></datalist></label>
			<label id="contextLabel">Context<select id="context"><option value="22" selected>22 frames</option><option value="39">39 frames</option><option value="90">90 frames</option></select></label>
			<label id="lastLabel">Last frame<input id="lastImage" type="text" placeholder="optional png or jpg"></label>
		</div>
		<div class="row">
			<label>Resolution<select id="size">
				<option value="160 288">160p portrait</option><option value="288 160">160p landscape</option>
				<option value="240 432">240p portrait</option><option value="432 240">240p landscape</option>
				<option value="368 640">368p portrait</option><option value="640 368">368p landscape</option>
				<option value="480 848" selected>480p portrait</option><option value="848 480">480p landscape</option>
				<option value="576 1024">576p portrait</option><option value="1024 576">576p landscape</option>
				<option value="720 1280">720p portrait</option><option value="1280 720">720p landscape</option>
				<option value="1088 1920">1088p portrait</option><option value="1920 1088">1088p landscape</option>
				<option value="1024 1024">1024 square</option><option value="2048 2048">2048 square</option>
				<option value="custom">Custom</option>
			</select></label>
			<label id="qualityLabel">Quality<select id="quality"></select></label>
		</div>
		<div class="row hidden" id="custom">
			<label>Width<input id="width" type="number" min="32" step="32" value="480"></label>
			<label>Height<input id="height" type="number" min="32" step="32" value="848"></label>
		</div>
		<div class="note" id="note"></div>
		<label>Model
			<div class="row">
				<button class="small" id="modelPrev" type="button">&#9664;</button>
				<input id="model" type="text" placeholder="default">
				<button class="small" id="modelPick" type="button">File</button>
				<button class="small" id="modelNext" type="button">&#9654;</button>
			</div>
		</label>
		<label>LoRAs <button class="small" id="addLora" type="button">Add file</button><div id="loras"></div></label>
		<label>Activity<pre id="log">Idle</pre></label>
		<div class="row">
			<label id="decoderLabel">Decoder<select id="decoder">
				<option value="" selected>auto</option>
				<option value="taef2">taef2</option>
				<option value="flux2-small-vae">flux2-small-vae</option>
				<option value="flux2-vae">flux2-vae</option>
			</select></label>
			<label id="encoderLabel">Text encoder<div id="encoderName">default</div></label>
			<label>Steps<input id="steps" type="number" min="0" step="1" value="0"></label>
			<label id="skipLabel">Skip<select id="skip"></select></label>
		</div>
		<div class="note" id="stepsNote"></div>
		<label id="lengthLabel">Length<input id="length" type="number" min="24" step="24" value="124"></label>
		<div class="note" id="lengthNote"></div>
		<details>
			<summary>Advanced</summary>
			<div class="row">
				<label>Seed<input id="seed" type="number" value="-1"></label>
				<label>Guidance<input id="guidance" type="number" min="0" step="0.5" value="0"></label>
			</div>
			<div class="row">
				<label>Spectrum<input id="spectrum" type="text" placeholder="quality preset"></label>
				<label>Sampler<select id="sampler"><option value="">default</option><option>euler</option><option>res_multistep</option><option>er_sde</option><option>euler_ancestral</option><option>dpmpp_2m_sde</option><option>gradient_estimation</option><option>lcm</option></select></label>
				<label>Scheduler<select id="scheduler"><option value="">default</option><option>simple</option><option>sgm_uniform</option><option>normal</option><option>beta</option><option>beta57</option><option>linear_quadratic</option><option>hyperflow</option></select></label>
			</div>
			<div class="row">
				<label>Vision<select id="vision"><option value="768">768</option><option value="off">off</option></select></label>
				<label class="field"><input id="crop" type="checkbox" checked> crop first frame</label>
				<label class="field"><input id="local" type="checkbox"> local</label>
				<label class="field"><input id="force" type="checkbox"> force</label>
			</div>
			<label>Output<input id="output" type="text" placeholder="numbered default"></label>
			<label>Models folder<input id="models" type="text" placeholder="ComfyUI models"></label>
			<label>Text encoder file<input id="textEncoder" type="text"></label>
			<div class="row">
				<label>VAE<input id="vae" type="text"></label>
				<label>Audio VAE<input id="audioVae" type="text"></label>
			</div>
		</details>
	</section>
	<section class="view">
		<div id="frame"><span id="placeholder">The preview shows up here</span></div>
		<div class="note" id="progress"></div>
		<div id="gallery">
			<button class="small" id="back" type="button">&#9664;</button>
			<span id="caption">No results yet</span>
			<button class="small" id="reuse" type="button">Animate</button>
			<button class="small" id="forward" type="button">&#9654;</button>
		</div>
	</section>
</main>
<script>
	const element = id => document.getElementById(id);
	const snap = n => Math.max(32, Math.floor(Number(n) / 32) * 32);
	const videoSnap = n => Math.ceil((Number(n) - 5) / 17) * 17 + 5;
	const mossQuality = [["best", "best (8)"], ["best25steps", "best25steps (25)"], ["best50steps", "best50steps (50)"], ["fast", "fast (8)"], ["faster", "faster (8)"], ["fastest", "fastest (4)"], ["fastest2steps", "fastest2steps (2)"]];
	const h3Quality = [["best", "best (8)"], ["fast", "fast (8)"], ["faster", "faster (8)"], ["fastest4steps", "fastest4steps (4)"], ["fastest2steps", "fastest2steps (2)"]];
	const mossSteps = { best: 8, best25steps: 25, best50steps: 50, fast: 8, faster: 8, fastest: 4, fastest2steps: 2 };
	const h3Steps = { best: 8, fast: 8, faster: 8, fastest4steps: 4, fastest2steps: 2 };
	const mossModel = "moss-image-sft-dit-int8-convrot.safetensors";
	const h3Model = "minimax_h3_fl2va_pruned_int8_convrot.safetensors";
	const h3ImageModel = "minimax_h3_image_pruned_int8_convrot.safetensors";
	const isVideo = mode => mode === "video" || mode === "extend" || mode === "imagevideo";
	const mossSkip = ["off", "6:36"];
	const h3Skip = ["off", "5:45", "10:40", "15:35"];
	const state = { mode: "image", loras: [], results: [], captions: [], examples: null, index: 0, paused: false, notice: "" };
	const storeKey = "strictgen-modes";
	const timesKey = "strictgen-times";
	const times = () => { try { return JSON.parse(localStorage.getItem(timesKey) || "{}"); } catch { return {}; } };
	const seconds = since => ((performance.now() - since) / 1000).toFixed(1) + " s";
	const stored = () => { try { return JSON.parse(localStorage.getItem(storeKey) || "{}"); } catch { return {}; } };
	const stepsFor = (mode, quality) => mode === "h3image" ? 6 : (mode === "image" ? mossSteps : h3Steps)[quality] || 8;
	const defaultsFor = mode => {
		if (mode === "h3image") return {
			prompt: "a red fox in a snowy birch forest at sunrise, soft golden light, detailed fur, photo", size: "2048 2048", width: 2048, height: 2048,
			quality: "", steps: 6, skip: "", model: h3ImageModel, loras: [], decoder: "", length: 124, context: 22, input: "", lastImage: ""
		};
		const video = mode !== "image";
		const quality = video ? "fast" : "fastest";
		return {
			prompt: video ? "a red fox walking through snow, cinematic" : "a red fox in a snowy forest at dawn, photo",
			size: video ? "custom" : "480 848", width: video ? 640 : 480, height: video ? 1152 : 848,
			quality, steps: stepsFor(mode, quality), skip: video ? "5:45" : "off", model: video ? h3Model : mossModel,
			loras: [], decoder: "", length: 124, context: 22, input: "", lastImage: ""
		};
	};
	const fill = (select, pairs, chosen) => {
		select.replaceChildren(...pairs.map(([value, label]) => new Option(label || value, value)));
		select.value = chosen;
	};
	const sizeOf = () => {
		if (element("size").value === "custom") return [snap(element("width").value), snap(element("height").value)];
		const [width, height] = element("size").value.split(" ").map(Number);
		return [snap(width), snap(height)];
	};
	const snapshot = () => ({
		prompt: element("prompt").value, size: element("size").value, width: Number(element("width").value), height: Number(element("height").value),
		quality: element("quality").value, steps: Number(element("steps").value), skip: element("skip").value, model: element("model").value,
		loras: state.loras, decoder: element("decoder").value, length: Number(element("length").value), context: Number(element("context").value),
		input: element("input").value, lastImage: element("lastImage").value
	});
	const save = () => {
		const all = stored();
		all[state.mode] = snapshot();
		localStorage.setItem(storeKey, JSON.stringify(all));
	};
	const applyFields = data => {
		element("prompt").value = data.prompt;
		element("size").value = [...element("size").options].some(option => option.value === data.size) ? data.size : "custom";
		element("custom").classList.toggle("hidden", element("size").value !== "custom");
		element("width").value = data.width; element("height").value = data.height;
		element("quality").value = data.quality;
		element("steps").value = data.steps;
		element("skip").value = data.skip;
		element("model").value = data.model;
		state.loras = data.loras || [];
		drawLoras();
		element("decoder").value = data.decoder || "";
		element("length").value = data.length; element("context").value = data.context;
		element("input").value = data.input || ""; element("lastImage").value = data.lastImage || "";
	};
	const showMode = () => {
		const mode = state.mode;
		for (const button of document.querySelectorAll(".modes button")) button.classList.toggle("on", button.dataset.mode === mode);
		const video = isVideo(mode), edit = mode === "h3image", moss = mode === "image";
		element("inputs").classList.toggle("hidden", moss || mode === "video");
		element("inputLabel").firstChild.textContent = edit ? "Image to edit (optional)" : "Image or video";
		element("contextLabel").classList.toggle("hidden", mode !== "extend");
		element("lastLabel").classList.toggle("hidden", mode !== "imagevideo");
		element("decoderLabel").classList.toggle("hidden", !moss);
		element("encoderLabel").classList.toggle("hidden", !moss);
		element("qualityLabel").classList.toggle("hidden", edit);
		element("skipLabel").classList.toggle("hidden", edit);
		element("lengthLabel").classList.toggle("hidden", !video);
		element("lengthNote").classList.toggle("hidden", !video);
		element("guidance").parentElement.classList.toggle("hidden", !moss);
		element("spectrum").parentElement.classList.toggle("hidden", !moss);
		element("sampler").parentElement.classList.toggle("hidden", edit);
		element("scheduler").parentElement.classList.toggle("hidden", edit);
		element("vision").parentElement.classList.toggle("hidden", edit);
		element("crop").parentElement.classList.toggle("hidden", edit);
		element("audioVae").parentElement.classList.toggle("hidden", !video);
		const saved = stored()[mode] || defaultsFor(mode);
		fill(element("quality"), edit ? [["", "default"]] : video ? h3Quality : mossQuality, saved.quality);
		fill(element("skip"), edit ? [["", "off"]] : (video ? h3Skip : mossSkip).map(value => [value, value]), saved.skip);
		applyFields(saved);
		note();
	};
	const timed = () => {
		const length = isVideo(state.mode) ? element("length").value : "";
		return [state.mode, element("quality").value, element("steps").value, sizeOf().join("x"), length, element("repeat").value].join(" ");
	};
	const fit = () => {
		const frame = element("frame"), view = document.querySelector("section.view"), main = document.querySelector("main");
		const [width, height] = sizeOf();
		const availH = main.clientHeight - 16 - element("gallery").offsetHeight - element("progress").offsetHeight - 8;
		const availW = main.clientWidth - document.querySelector("section.controls").offsetWidth - 60;
		const scale = Math.min(availW / width, availH / height);
		const wide = Math.max(1, Math.floor(width * scale));
		frame.style.width = wide + "px";
		frame.style.height = Math.max(1, Math.floor(height * scale)) + "px";
		view.style.width = wide + "px";
	};
	const note = () => {
		fit();
		const [width, height] = sizeOf();
		const typed = element("size").value === "custom" ? "" : element("size").value.split(" ").map(Number);
		const changed = typed && (typed[0] !== width || typed[1] !== height);
		const last = times()[timed()];
		element("note").textContent = width + "x" + height + (changed ? " after snapping to a multiple of 32" : "") + (last ? ", took " + last + " last time" : "");
		element("stepsNote").textContent = element("steps").value + " steps";
		if (!isVideo(state.mode)) return;
		const length = Number(element("length").value) || 24;
		const context = state.mode === "extend" ? Number(element("context").value) : 0;
		const total = state.mode === "extend" ? videoSnap(context + length) : videoSnap(length);
		const added = state.mode === "extend" ? total - context : total;
		element("lengthNote").textContent = added + " frames, " + (added / 24).toFixed(1) + " s" + (state.mode === "extend" ? " new, clip " + total : "");
	};
	document.querySelectorAll(".modes button").forEach(button => button.onclick = () => { save(); state.mode = button.dataset.mode; showMode(); });
	element("quality").onchange = () => { element("steps").value = stepsFor(state.mode, element("quality").value); note(); save(); };
	element("size").onchange = () => { element("custom").classList.toggle("hidden", element("size").value !== "custom"); note(); };
	element("width").oninput = note;
	element("height").oninput = note;
	element("steps").oninput = note;
	element("length").oninput = note;
	element("context").onchange = note;
	const form = () => {
		const [width, height] = sizeOf();
		const body = {
			mode: state.mode, prompt: element("prompt").value, width, height,
			quality: element("quality").value, steps: Number(element("steps").value) || 0, skip: element("skip").value,
			decoder: element("decoder").value, length: Number(element("length").value) || 24, context: Number(element("context").value) || 22,
			model: element("model").value, loras: state.loras, seed: Number(element("seed").value), count: Number(element("repeat").value) || 1,
			guidance: Number(element("guidance").value) || 0, spectrum: element("spectrum").value, sampler: element("sampler").value,
			scheduler: element("scheduler").value, crop: element("crop").checked ? "true" : "false", vision: element("vision").value,
			output: element("output").value, models: element("models").value, textEncoder: element("textEncoder").value,
			vae: element("vae").value, audioVae: element("audioVae").value, local: element("local").checked, force: element("force").checked,
			remote: element("machine").value
		};
		if (state.mode === "extend") body.video = element("input").value;
		if (state.mode === "imagevideo") { body.image = element("input").value; body.lastImage = element("lastImage").value; }
		if (state.mode === "h3image") body.image = element("input").value;
		return body;
	};
	const drawLoras = () => {
		element("loras").replaceChildren(...state.loras.map((lora, index) => {
			const row = document.createElement("div");
			row.className = "lora";
			const name = document.createElement("input");
			name.type = "text"; name.value = lora.path; name.placeholder = "LoRA path";
			name.onchange = () => lora.path = name.value;
			const strength = document.createElement("input");
			strength.type = "number"; strength.step = "0.05"; strength.value = lora.strength;
			strength.onchange = () => lora.strength = Number(strength.value) || 0;
			const remove = document.createElement("button");
			remove.className = "small"; remove.type = "button"; remove.textContent = "Remove";
			remove.onclick = () => { state.loras.splice(index, 1); drawLoras(); };
			row.append(name, strength, remove);
			return row;
		}));
	};
	const neighbor = async (box, step) => {
		if (!box.value) return;
		const next = await fetch("/neighbor?path=" + encodeURIComponent(box.value) + "&step=" + step).then(r => r.text());
		if (next) box.value = next;
	};
	element("modelPrev").onclick = () => neighbor(element("model"), -1);
	element("modelNext").onclick = () => neighbor(element("model"), 1);
	element("inputPrev").onclick = () => neighbor(element("input"), -1);
	element("inputNext").onclick = () => neighbor(element("input"), 1);
	const pick = async kind => (await fetch("/pick?kind=" + kind).then(response => response.text())).trim();
	element("modelPick").onclick = async () => { const path = await pick("model"); if (path) { element("model").value = path; save(); } };
	element("addLora").onclick = async () => { const path = await pick("lora"); if (path) { state.loras.push({ path, strength: 1 }); drawLoras(); save(); } };
	element("inputPick").onclick = async () => { const path = await pick(state.mode === "extend" ? "video" : "image"); if (path) { element("input").value = path; save(); } };
	element("input").onchange = async () => {
		if (!element("input").value.toLowerCase().endsWith(".mp4")) return;
		const size = await fetch("/probe?path=" + encodeURIComponent(element("input").value)).then(r => r.text());
		if (!size) return;
		element("size").value = "custom";
		element("custom").classList.remove("hidden");
		const [width, height] = size.split(" ");
		element("width").value = width; element("height").value = height; note();
	};
	element("recent").onchange = () => {
		reuse(element("recent").value);
	};
	const place = node => {
		const frame = element("frame");
		frame.appendChild(node);
		const previous = [...frame.children].filter(child => child !== node);
		requestAnimationFrame(() => previous.forEach(child => {
			if (child.src && child.src.startsWith("blob:")) URL.revokeObjectURL(child.src);
			child.remove();
		}));
	};
	const media = path => {
		const url = "/file?path=" + encodeURIComponent(path);
		if (path.toLowerCase().endsWith(".mp4")) {
			const video = document.createElement("video");
			video.src = url; video.autoplay = true; video.loop = true; video.muted = true; video.controls = true;
			video.onclick = () => { video.paused ? video.play() : video.pause(); };
			place(video);
			return;
		}
		const image = new Image();
		image.onload = () => place(image);
		image.src = url;
	};
	const showNoise = () => {
		const canvas = document.createElement("canvas");
		canvas.width = 480; canvas.height = 640;
		const context = canvas.getContext("2d");
		const data = context.createImageData(canvas.width, canvas.height);
		let seed = 74101;
		for (let index = 0; index < data.data.length; index += 4) {
			seed = (seed * 16807) % 2147483647;
			const value = seed % 256;
			data.data[index] = data.data[index + 1] = data.data[index + 2] = value;
			data.data[index + 3] = 255;
		}
		context.putImageData(data, 0, 0);
		place(canvas);
	};
	const showPreview = status => {
		if (status.running !== state.running) { state.running = status.running; state.previewStamp = 0; showNoise(); }
		if (!status.previewStamp || status.previewStamp === state.previewStamp || state.previewLoading) return;
		state.previewLoading = true;
		const stamp = status.previewStamp;
		fetch("/file?path=" + encodeURIComponent(status.preview)).then(response => response.ok ? response.blob() : null).then(blob => {
			state.previewLoading = false;
			if (!blob || blob.size < 500) return;
			const image = new Image();
			const url = URL.createObjectURL(blob);
			image.onload = () => { state.previewStamp = stamp; place(image); };
			image.onerror = () => URL.revokeObjectURL(url);
			image.src = url;
		}).catch(() => { state.previewLoading = false; });
	};
	const gallery = () => [...(state.examples || []), ...state.results];
	const showResult = () => {
		const all = gallery();
		if (!all.length) { element("caption").textContent = "No results yet"; return; }
		state.index = Math.max(0, Math.min(all.length - 1, state.index));
		const path = all[state.index];
		media(path);
		fit();
		const examples = (state.examples || []).length;
		const caption = state.index < examples ? "example" : (state.captions[state.index - examples] || path);
		element("caption").textContent = (state.index + 1) + "/" + all.length + ", " + caption;
		element("reuse").textContent = path.toLowerCase().endsWith(".mp4") ? "Extend" : "Animate";
	};
	const reuse = path => {
		if (!path) return;
		save();
		state.mode = path.toLowerCase().endsWith(".mp4") ? "extend" : "imagevideo";
		showMode();
		element("input").value = path;
		element("input").onchange();
		save();
	};
	element("reuse").onclick = () => reuse(gallery()[state.index]);
	element("back").onclick = () => { state.index -= 1; showResult(); };
	element("forward").onclick = () => { state.index += 1; showResult(); };
	window.onkeydown = event => {
		if (event.target.matches("input, textarea")) return;
		if (event.code !== "Space") return;
		const video = element("frame").querySelector("video");
		if (!video) return;
		event.preventDefault();
		video.paused ? video.play() : video.pause();
	};
	const gb = bytes => (Number(bytes) / 1073741824).toFixed(1) + " GB";
	const apply = fields => {
		if (fields.mode) { state.mode = fields.mode; showMode(); }
		if (fields.prompt) element("prompt").value = fields.prompt;
		if (fields.width && fields.height) {
			const value = fields.width + " " + fields.height;
			element("size").value = [...element("size").options].some(option => option.value === value) ? value : "custom";
			element("custom").classList.toggle("hidden", element("size").value !== "custom");
			element("width").value = fields.width; element("height").value = fields.height;
		}
		if (fields.quality) element("quality").value = fields.quality;
		if (fields.seed !== undefined) element("seed").value = fields.seed;
		if (fields.image) element("input").value = fields.image;
		if (fields.model) element("model").value = fields.model;
		note();
	};
	element("import").onclick = () => element("workflow").click();
	element("workflow").onchange = async () => {
		const file = element("workflow").files[0];
		if (!file) return;
		const fields = await fetch("/import", { method: "POST", body: await file.text() }).then(r => r.json());
		apply(fields);
		element("workflow").value = "";
	};
	element("run").onclick = async () => {
		save();
		state.hold = true;
		state.clicked = state.busy ? null : { key: timed(), at: performance.now(), results: state.results.length };
		element("log").textContent = "Run started\n" + element("prompt").value.split("\n")[0];
		try {
			const status = await fetch("/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(form()) }).then(response => response.json());
			state.hold = false;
			showStatus(status);
		} catch (error) {
			state.hold = false;
			element("log").textContent = "Run started\n" + error;
		}
	};
	element("stop").onclick = () => fetch("/stop", { method: "POST" });
	element("position").onclick = () => element("menu").classList.toggle("hidden");
	const showStatus = status => {
		const others = (status.peers || []).length;
		const ram = status.ramTotal ? "RAM " + gb(status.ram) + " / " + gb(status.ramTotal) + " · VRAM " + gb(status.vram) + " / " + gb(status.vramTotal) + " · GPU " + status.gpu + "% · CPU " + Math.round(status.cpu) + "%" : "RAM — · VRAM — · GPU — · CPU —";
		element("meters").textContent = ram + " · " + others + (others === 1 ? " other PC" : " other PCs");
		element("position").textContent = status.position || "run 0 · queue 0 · done 0";
		const row = text => { const line = document.createElement("div"); line.textContent = text; return line; };
		const title = text => { const line = document.createElement("div"); line.textContent = text; line.style.color = "#8b97a5"; return line; };
		element("menu").replaceChildren(title("Running"), row(status.running || "—"), title("Queued"), ...((status.queued || []).map(row)), title("Done"), ...((status.done || []).slice(-8).map(row)));
		const machine = element("machine"), chosen = machine.value;
		machine.replaceChildren(new Option("Best machine", ""), new Option("This PC", "local"));
		for (const peer of status.peers || []) machine.add(new Option(peer.label, peer.address));
		if ([...machine.options].some(option => option.value === chosen)) machine.value = chosen;
		const list = element("recentList");
		list.replaceChildren(...(status.recent || []).map(path => { const option = document.createElement("option"); option.value = path; return option; }));
		if (!state.hold && typeof status.activity === "string" && element("log").textContent !== status.activity) {
			element("log").textContent = status.activity;
			element("log").scrollTop = element("log").scrollHeight;
		}
		if (status.busy && !state.busy) state.began = performance.now();
		const waiting = (status.queued || []).length;
		if (status.busy) element("progress").textContent = "Running " + seconds(state.began) + (waiting ? ", " + waiting + " queued" : "") + (status.step ? " · " + status.step : "");
		else if (state.busy) element("progress").textContent = "Done in " + seconds(state.began);
		if (state.clicked && !status.busy && !waiting && status.results && status.results.length > state.clicked.results) {
			const all = times();
			all[state.clicked.key] = seconds(state.clicked.at);
			localStorage.setItem(timesKey, JSON.stringify(all));
			state.clicked = null;
			note();
		}
		state.busy = status.busy;
		if (status.examples && state.examples.join() !== status.examples.join()) state.examples = status.examples;
		const same = status.results && status.results.join() === state.results.join();
		if (status.results && !same) {
			const grew = status.results.length > state.results.length;
			state.results = status.results; state.captions = status.captions || [];
			if (grew) state.index = state.examples.length + state.results.length - 1;
			showResult();
		}
		if (status.busy && state.mode === "image") showPreview(status);
		else state.previewStamp = 0;
	};
	const poll = async () => { showStatus(await fetch("/status").then(response => response.json())); };
	document.querySelector("section").addEventListener("change", save);
	state.examples = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(number => "MossWebExample" + number + ".jpg");
	state.examples.forEach(path => { const image = new Image(); image.src = "/file?path=" + encodeURIComponent(path); });
	showResult();
	showMode();
	addEventListener("resize", fit);
	const watch = async () => { await poll().catch(() => {}); setTimeout(watch, state.busy || state.clicked ? 100 : 400); };
	watch();
</script>
</body>
</html>

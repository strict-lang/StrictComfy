<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StrictGen - Generate Images and Videos locally faster than anything else</title>

<style>
	html { color-scheme: dark; }
	html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; color: #d8dee9; font: 16px system-ui, sans-serif; }
	body { display: flex; flex-direction: column; height: 100%; }
	header { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; padding: 2px 12px; background: #0f151c; flex: none; font-size: 12px; color: #8b97a5; white-space: nowrap; }
	header #job { overflow: hidden; text-overflow: ellipsis; color: #d8dee9; }
	header #right { display: flex; gap: 8px; align-items: center; justify-content: flex-end; min-width: 0; }
	header select { font-size: 12px; padding: 1px 4px; border-radius: 4px; }
	header button.run, header button.stop { font-size: 13px; padding: 2px 16px; border-radius: 5px; line-height: 1.3; flex: none; }
	header #position { font: inherit; color: #8b97a5; background: none; border: 0; padding: 0; cursor: pointer; }
	footer { flex: none; text-align: center; font-size: 12px; color: #6b7785; padding: 0 16px 4px; }
	footer a { color: #5fb3f6; text-decoration: none; }
	main { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: stretch; gap: 28px; padding: 8px 16px; box-sizing: border-box; }
	section.controls { width: min(540px, 44vw); display: flex; flex-direction: column; gap: 8px; min-height: 0; flex: none; }
	#fields { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable; display: flex; flex-direction: column; gap: 10px; padding-right: 6px; }
	section.view { flex: none; display: flex; flex-direction: column; align-items: center; min-height: 0; min-width: 440px; }
	label { font-size: 13px; color: #8b97a5; display: flex; flex-direction: column; gap: 4px; }
	textarea, input, select { font: inherit; color: #d8dee9; background: #141b23; border: 1px solid #2b3540; border-radius: 6px; padding: 8px; min-width: 0; max-width: 100%; box-sizing: border-box; }
	.row > select { flex: 1; }
	textarea { resize: vertical; min-height: 150px; }
	.row { display: flex; gap: 10px; }
	.row label, .row .field { flex: 1; min-width: 0; }
	.row label.wide { flex: 2; }
	.modes { display: flex; gap: 6px; }
	.modes button { flex: 1; line-height: 1.2; }
	.modes button, button.small, button.ghost { font-size: 14px; padding: 6px 10px; background: #1f2933; color: #d8dee9; border: 0; border-radius: 8px; cursor: pointer; white-space: nowrap; }
	.modes button { white-space: normal; }
	.modes button.on { background: #5fb3f6; color: #0b0f14; }
	button.run { flex: 1; font: inherit; font-size: 18px; padding: 10px 18px; border: 0; border-radius: 8px; background: #5fb3f6; color: #0b0f14; cursor: pointer; }
	button.stop { background: #e88388; color: #0b0f14; border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; font: inherit; }
	.note { color: #e8b383; font-size: 13px; }
	.hidden { display: none !important; }
	#loras { display: flex; flex-direction: column; gap: 4px; }
	.lora { display: flex; gap: 8px; align-items: center; }
	.lora input.name { flex: 1; }
	.lora input.strength { width: 70px; flex: none; }
	#frame { position: relative; flex: none; overflow: hidden; }
	#stage { position: absolute; inset: 0; transform-origin: 0 0; }
	#stage img, #stage video, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
	#stage.zoomed { cursor: grab; }
	.side { flex: none; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
	#inputSide { margin-right: auto; }
	#outputSide { margin-left: auto; }
	.side.away { visibility: hidden; }
	.strip { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 6px; scrollbar-width: thin; scrollbar-gutter: stable; padding-right: 10px; }
	#inputPicked { flex: none; width: 116px; height: 204px; border: 2px solid #5fb3f6; border-radius: 6px; overflow: hidden; background: #141b23; box-sizing: border-box; position: relative; }
	#inputPicked img, #inputPicked video { width: 112px; height: 200px; object-fit: contain; display: block; }
	#inputPicked span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; color: #d8dee9; background: rgba(11, 15, 20, 0.75); padding: 1px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.strip button.thumb { flex: none; width: 94px; height: 164px; padding: 0; border: 2px solid transparent; border-radius: 6px; overflow: hidden; background: #141b23; cursor: pointer; position: relative; }
	.strip button.thumb:hover { border-color: #2b3540; }
	.strip button.thumb.on { border-color: #5fb3f6; }
	.strip button.thumb img, .strip button.thumb video { width: 90px; height: 160px; object-fit: contain; display: block; pointer-events: none; }
	.strip button.thumb span { position: absolute; right: 3px; bottom: 3px; font-size: 10px; color: #d8dee9; background: rgba(11, 15, 20, 0.7); border-radius: 3px; padding: 0 3px; }
	#stage > * { transition: opacity 0.15s; }
	#stage.dim > * { opacity: 0.2; transition: opacity 0.4s; }
	#info { flex: none; display: flex; gap: 12px; width: 0; min-width: 100%; box-sizing: border-box; overflow: hidden; font-size: 13px; color: #8b97a5; padding-top: 6px; min-height: 18px; }
	#infoText { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #a3be8c; }
	#infoTime { flex: none; color: #e8b383; }
	#gallery { flex: none; display: flex; gap: 8px; align-items: center; width: 100%; font-size: 13px; color: #8b97a5; padding-top: 6px; }
	#count { flex: none; min-width: 44px; text-align: center; }
	#picker { position: relative; flex: 1 1 220px; min-width: 120px; max-width: 320px; }
	#pick { width: 100%; padding: 5px 8px; font-size: 13px; }
	#options { position: absolute; z-index: 3; bottom: 100%; left: 0; right: 0; max-height: 50vh; overflow-y: auto; background: #141b23; border: 1px solid #2b3540; border-radius: 6px; }
	#options div { padding: 4px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d8dee9; }
	#options div:hover, #options div.on { background: #1f2933; }
	#options div.on { color: #5fb3f6; }
	#gallery #reuse { margin-left: auto; }
	#queue { position: relative; }
	#menu { position: absolute; z-index: 4; top: 100%; right: 0; background: #141b23; border: 1px solid #2b3540; border-radius: 8px; min-width: 280px; max-width: 420px; padding: 8px; }
	#menu div { font-size: 13px; padding: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d8dee9; }
	details { color: #8b97a5; font-size: 13px; }
	details > * { margin-top: 8px; }
	details .field { flex-direction: row; align-items: center; }
	#log { min-height: 200px; max-height: 360px; overflow: auto; font: 12px ui-monospace, monospace; color: #d8dee9; background: #0f151c; border-radius: 6px; padding: 8px; margin: 0; }
	#log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#log div.run { color: #5fb3f6; margin-top: 8px; }
	#log div.run:first-child { margin-top: 0; }
	#log div.prompt { white-space: normal; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; color: #a3be8c; }
	#log div.error { color: #e88388; }
	#log div.muted { color: #8b97a5; }
	#overlay { position: absolute; inset: auto 0 0 0; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; background: rgba(15, 21, 28, 0.8); text-align: center; padding: 7px 12px; box-sizing: border-box; pointer-events: none; }
	#overlay .stage { font-size: 15px; color: #d8dee9; max-width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	#overlay .bar { width: 100%; height: 5px; background: #1f2933; border-radius: 3px; overflow: hidden; }
	#overlay .bar div { height: 100%; width: 0; background: #5fb3f6; transition: width 0.12s; }
	#offline { background: #e88388; color: #0b0f14; padding: 6px 16px; font-size: 14px; }
	@media (max-width: 720px) {
		html, body { overflow: auto; height: auto; }
		header { grid-template-columns: 1fr; gap: 2px; white-space: normal; }
		main { flex-direction: column; }
		section.controls, section.view { width: 100%; min-width: 0; }
		#fields { overflow: visible; }
		section.view { order: -1; }
		.side { display: none !important; }
	}
</style>
</head>
<body>
<div id="offline" class="hidden">The StrictGen server does not answer, start StrictGen.exe again on the PC that runs it</div>
<header>
	<div id="job">Idle</div>
	<div id="meters">RAM — · VRAM — · GPU — · CPU —</div>
	<div id="right">
		<select id="machine"><option value="">This PC</option></select>
		<div id="queue"><button id="position" type="button">queue 0 done 0</button><div id="menu" class="hidden"></div></div>
		<select id="repeat" title="Repeat"><option value="1">1x</option><option value="2">2x</option><option value="4">4x</option><option value="10">10x</option><option value="20">20x</option></select>
		<button class="run" id="run" type="button" title="Shift+Enter adds a line to the prompt">Run (Enter)</button>
		<button class="stop" id="stop" type="button" >Stop (Esc)</button>
	</div>
</header>
<main>
	<aside class="side away" id="inputSide"><div id="inputPicked" title="Selected input"></div><div class="strip" id="inputStrip" title="Click an image to use it as the input"></div></aside>
	<section class="controls">
		<div id="fields">
			<div class="modes">
				<button type="button" data-mode="image" class="on">Moss<br>Image</button>
				<button type="button" data-mode="video">H3<br>Video</button>
				<button type="button" data-mode="extend">H3 Video<br>Extend</button>
				<button type="button" data-mode="imagevideo">H3 Image<br>to Video</button>
				<button type="button" data-mode="h3image">H3<br>Image</button>
			</div>
			<label>Prompt<textarea id="prompt">a red fox in a snowy forest at dawn, photo</textarea></label>
			<div id="inputs">
				<label id="inputLabel">Image or video
					<div class="row">
						<button class="small" id="inputPrev" type="button">&#9664;</button>
						<input id="input" type="text" placeholder="png, jpg, or mp4" style="flex: 1">
						<button class="small" id="inputPick" type="button">Upload</button>
						<button class="small" id="inputNext" type="button">&#9654;</button>
						<input id="inputFile" type="file" accept=".png,.jpg,.jpeg,.mp4" hidden>
					</div>
				</label>
				<label id="contextLabel">Context<select id="context"><option value="22" selected>22 frames</option><option value="39">39 frames</option><option value="90">90 frames</option></select></label>
				<label id="lastLabel">Last frame
					<div class="row">
						<input id="lastImage" type="text" placeholder="optional png or jpg" style="flex: 1">
						<button class="small" id="lastPick" type="button">Upload</button>
						<input id="lastFile" type="file" accept=".png,.jpg,.jpeg" hidden>
					</div>
				</label>
			</div>
			<div class="row">
				<label class="wide">Resolution<select id="size">
					<option value="160 288">160p portrait</option><option value="288 160">160p landscape</option>
					<option value="240 432">240p portrait</option><option value="432 240">240p landscape</option>
					<option value="368 640">368p portrait</option><option value="640 368">368p landscape</option>
					<option value="480 848" selected>480p portrait</option><option value="848 480">480p landscape</option>
					<option value="576 1024">576p portrait</option><option value="1024 576">576p landscape</option>
					<option value="720 1280">720p portrait</option><option value="1280 720">720p landscape</option>
					<option value="1088 1920">1088p portrait</option><option value="1920 1088">1088p landscape</option>
					<option value="1024 1024">1024 square</option><option value="2048 2048">2048 square</option>
					<option value="custom">Custom</option>
				</select></label>
				<label class="wide" id="qualityLabel">Quality<select id="quality"></select></label>
				<label>Steps<input id="steps" type="number" min="0" step="1" value="0"></label>
				<label id="skipLabel">Skip<select id="skip"></select></label>
			</div>
			<div class="row hidden" id="custom">
				<label>Width<input id="width" type="number" min="32" step="32" value="480"></label>
				<label>Height<input id="height" type="number" min="32" step="32" value="848"></label>
			</div>
			<label id="lengthLabel">Length<select id="length"></select></label>
			<div class="note hidden" id="lengthNote"></div>
			<label>Model<select id="model"></select></label>
			<label>LoRAs
				<div class="row">
					<select id="loraChoice"></select>
					<button class="small" id="addLora" type="button">Add</button>
				</div>
				<div id="loras"></div>
			</label>
			<label>Activity<div id="log"><div class="muted">Idle</div></div></label>
			<details>
				<summary>Advanced</summary>
				<div class="row">
					<label id="decoderLabel">Decoder<select id="decoder"></select></label>
					<label>Seed<input id="seed" type="number" value="-1"></label>
					<label>Guidance<input id="guidance" type="number" min="0" step="0.5" value="0"></label>
				</div>
				<div class="row">
					<label>Spectrum<input id="spectrum" type="text" placeholder="quality preset"></label>
					<label>Sampler<select id="sampler"><option value="">default</option><option>euler</option><option>res_multistep</option><option>er_sde</option><option>euler_ancestral</option><option>dpmpp_2m_sde</option><option>gradient_estimation</option><option>lcm</option></select></label>
					<label>Scheduler<select id="scheduler"><option value="">default</option><option>simple</option><option>sgm_uniform</option><option>normal</option><option>beta</option><option>beta57</option><option>linear_quadratic</option><option>hyperflow</option></select></label>
				</div>
				<div class="row">
					<label>Vision<select id="vision"><option value="768">768</option><option value="off">off</option></select></label>
					<label class="field"><input id="crop" type="checkbox" checked> crop first frame</label>
					<label class="field"><input id="local" type="checkbox"> local</label>
					<label class="field"><input id="force" type="checkbox"> force</label>
				</div>
				<label>Output<input id="output" type="text" placeholder="numbered default"></label>
				<label>Models folder<input id="models" type="text" placeholder="ComfyUI models"></label>
				<label>Text encoder file<input id="textEncoder" type="text"></label>
				<div class="row">
					<label>VAE<input id="vae" type="text"></label>
					<label>Audio VAE<input id="audioVae" type="text"></label>
				</div>
				<div class="row">
					<button class="small" id="import" type="button">Import ComfyUI workflow</button>
					<input id="workflow" type="file" accept=".json" hidden>
				</div>
			</details>
		</div>
	</section>
	<section class="view">
		<div id="frame"><div id="stage"><span id="placeholder">The preview shows up here</span></div><div id="overlay" class="hidden"><div class="stage"></div><div class="bar"><div></div></div></div></div>
		<div id="info"><span id="infoText"></span><span id="infoTime"></span></div>
		<div id="gallery">
			<button class="small" id="back" type="button">&#9664;</button>
			<span id="count">0/0</span>
			<div id="picker"><input id="pick" type="text" placeholder="No results yet" autocomplete="off" spellcheck="false"><div id="options" class="hidden"></div></div>
			<button class="small" id="forward" type="button">&#9654;</button>
			<button class="small" id="reuse" type="button">Send to H3 Image to Video</button>
		</div>
	</section>

		if (running) showPreview(status);
		else { state.previewStamp = 0; state.hasPreview = false; }
		showOverlay(running, !!state.hasPreview);
	};
	const poll = async () => {
		try { showStatus(await timed_fetch("/status").then(response => response.json())); state.misses = 0; offline(false); }
		catch { state.misses = (state.misses || 0) + 1; if (state.misses >= 2) offline(true); }
	};
	document.querySelector("section").addEventListener("change", save);
	element("repeat").onchange = save;
	const view = read(viewKey, {});
	if (titles[view.mode]) state.mode = view.mode;
	if (view.repeat) element("repeat").value = view.repeat;
	if (view.machine) state.wanted = view.machine;
	showMode();
	addEventListener("resize", fit);
	loadOutputs(true);
	const watch = async () => { await poll(); setTimeout(watch, state.offline ? 1500 : state.busy || (state.clicked && performance.now() - state.clicked < 10000) ? 60 : 400); };
	watch();
</script>
</body>
</html>
